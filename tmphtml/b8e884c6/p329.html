document.getElementById('heroImg').src = DATA.hero;
document.getElementById('heroTitle').textContent = DATA.titleText || (DATA.count + ' 张照片');
document.getElementById('heroSub').textContent = DATA.subText || DATA.dateRange;
if (DATA.pager) {
  const p = document.getElementById('pager');
  p.style.display = 'flex';
  const prev = document.getElementById('pgPrev'), next = document.getElementById('pgNext');
  if (DATA.pager.prev) { prev.onclick = () => location.href = DATA.pager.prev; }
  else { prev.disabled = true; }
  if (DATA.pager.next) { next.onclick = () => location.href = DATA.pager.next; }
  else { next.disabled = true; }
}
const groups = document.getElementById('groups');
DATA.groups.forEach(g => {
  const h = document.createElement('div');
  h.className = 'datehead';
  h.textContent = g.date;
  const gr = document.createElement('div');
  gr.className = 'grid';
  g.items.forEach((f, k) => {
    const item = document.createElement('div');
    item.className = 'item';
    const im = document.createElement('img');
    im.src = f.u; im.loading = 'lazy'; im.alt = '';
    im.onclick = () => openLb(g.items, k);
    const btn = document.createElement('button');
    btn.className = 'save-btn';
    btn.textContent = '⬇ 保存';
    btn.onclick = (e) => { e.stopPropagation(); saveImg(f.u, f.n); };
    item.appendChild(im);
    item.appendChild(btn);
    gr.appendChild(item);
  });
  groups.appendChild(h);
  groups.appendChild(gr);
});

/* 保存图片：dataURL 转 blob 下载，文件名规范 */
function saveImg(url, name) {
  fetch(url).then(r => r.blob()).then(b => {
    const u = URL.createObjectURL(b);
    const a = document.createElement('a');
    a.href = u; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(u), 4000);
  }).catch(() => toast('保存失败，可长按图片另存'));
}

let lbList = [], lbPos = 0;
function openLb(list, k) {
  lbList = list; lbPos = k;
  document.getElementById('lightbox').style.display = 'flex';
  updLb();
}
function updLb() {
  document.getElementById('lbImg').src = lbList[lbPos].u;
  document.getElementById('lbIdx').textContent = (lbPos + 1) + ' / ' + lbList.length;
}
function lbNav(d) { lbPos = (lbPos + d + lbList.length) % lbList.length; updLb(); }
function lbSave() { saveImg(lbList[lbPos].u, lbList[lbPos].n); }
function closeLb() { document.getElementById('lightbox').style.display = 'none'; }
let toastTimer = null;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.style.display = 'none'; }, 4000);
}
document.addEventListener('keydown', e => {
  if (document.getElementById('lightbox').style.display !== 'flex') return;
  if (e.key === 'Escape') closeLb();
  if (e.key === 'ArrowLeft') lbNav(-1);
  if (e.key === 'ArrowRight') lbNav(1);
});
</script>
