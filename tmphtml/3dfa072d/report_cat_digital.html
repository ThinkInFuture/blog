<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>数码明细 · 家庭财务报表</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--blue:#2563eb;--green:#10b981;--red:#ef4444}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,'PingFang SC','Microsoft YaHei',Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;padding-bottom:40px}
.wrap{max-width:640px;margin:0 auto;padding:0 14px}
.hero{padding:22px 0 14px}
.hero h1{font-size:20px;font-weight:700}
.hero .sub{font-size:12px;color:var(--muted);margin-top:5px}
.card{background:var(--card);border-radius:16px;border:1px solid rgba(15,23,42,.05);box-shadow:0 1px 2px rgba(15,23,42,.04),0 8px 24px -18px rgba(15,23,42,.35);padding:16px;margin-bottom:12px}
.metrics{display:flex;gap:18px;flex-wrap:wrap}
.metrics .v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.metrics .l{font-size:11.5px;color:var(--muted)}
table.data{width:100%;border-collapse:collapse;font-size:12.5px}
table.data th{background:#f1f5f9;color:#475569;font-weight:600;padding:7px 8px;text-align:left;font-size:11.5px;border-bottom:1px solid var(--line)}
table.data td{padding:6px 8px;border-bottom:1px solid #f1f5f9;font-variant-numeric:tabular-nums}
table.data tr:nth-child(even){background:#fafbfd}
table.data td.num{text-align:right}
table.data tr.total-row td{background:#eef6ff;font-weight:700}
a.back{color:var(--blue);text-decoration:none;font-size:12.5px}
footer{margin-top:10px;font-size:11px;color:#94a3b8;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <h1>数码明细</h1>
    <p class="sub">家庭财务报表 · 分类逐笔明细 · 2024-12-15 至 2026-11-14</p>
  </header>
  <div class="card">
    <div class="metrics">
      <div><div class="v">¥419.00</div><div class="l">累计金额</div></div>
      <div><div class="v">2 个周期</div><div class="l">出现次数</div></div>
      <div><div class="v">¥209.50</div><div class="l">出现周期月均</div></div>
    </div>
  </div>
  <div class="card">
    <table class="data">
      <tr><th>记账周期</th><th>条目明细</th><th>小计</th></tr>
      <tr><td>260715 → 260814</td><td>录音笔 200</td><td class='num'>¥200.00</td></tr>
      <tr><td>260615 → 260714</td><td>大疆随心换 219</td><td class='num'>¥219.00</td></tr>
      <tr class="total-row"><td>合计</td><td></td><td class="num">¥419.00</td></tr>
    </table>
  </div>
  <footer><a class="back" href="https://huashanblogllm.xyz/tmphtml/3dfa072d/index.html">← 返回家庭财务报表</a></footer>
</div>
</body>
</html>
